<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>展覽導覽頁 - 第一頁</title>
  <!-- 引入 GSAP (與第三頁相同的動態引擎) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #111111;
      font-family: "PingFang TC", "Noto Sans CJK TC", "Microsoft JhengHei", sans-serif;
      color: #FFFFFF;
    }

    .page-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    /* Canvas 全螢幕繪製區域 */
    #heroCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* 文字與按鈕 Overlay */
    .content-overlay {
      position: relative;
      z-index: 2;
      margin-top: 360px; /* 控制文字與 Logo 的上下距離 */
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      pointer-events: none; /* 避免擋到 Canvas 事件 */
    }

    .text-wrapper {
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .title-wrapper {
      height: 44px;
    }

    .subtitle-wrapper {
      height: 36px;
      margin-top: 10px;
    }

    /* 文字基礎設定 (由 GSAP 控制 translateY & opacity) */
    .text-line {
      transform: translateY(100%);
      opacity: 0;
      will-change: transform, opacity;
    }

    .title-part1 {
      font-size: 1.6rem;
      letter-spacing: 0.4em;
      color: #F7D070; /* 亮金色 */
      font-weight: 300;
    }

    .title-part2 {
      font-size: 1.1rem;
      letter-spacing: 0.3em;
      color: #E28C43; /* 橘金色 */
      font-weight: 400;
    }

    /* 箭頭按鈕 */
    .scroll-arrow-btn {
      margin-top: 30px;
      background: none;
      border: none;
      cursor: pointer;
      outline: none;
      opacity: 0;
      pointer-events: auto;
    }

    .arrow-icon {
      width: 36px;
      height: 36px;
      stroke: #F7D070;
      stroke-width: 2.5;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0px 0px 8px rgba(247, 208, 112, 0.6));
    }
  </style>
</head>
<body>

  <div class="page-container">
    <canvas id="heroCanvas"></canvas>

    <div class="content-overlay">
      <div class="text-wrapper title-wrapper">
        <div class="text-line title-part1" id="line1">回憶</div>
      </div>
      
      <div class="text-wrapper subtitle-wrapper">
        <div class="text-line title-part2" id="line2">從這裡開始</div>
      </div>

      <button class="scroll-arrow-btn" id="nextPageBtn" aria-label="向下滾動">
        <svg class="arrow-icon" viewBox="0 0 24 24">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('heroCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // -------------------------------------------------------------
    // ⚙️ 1. 背景飄移金塵微粒 (繼承第三頁邏輯)
    // -------------------------------------------------------------
    const DUST_COUNT = 60;
    let floatingDustParticles = [];

    class FloatingDust {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 2.2 + 0.8;
        this.vx = (Math.random() - 0.5) * 0.5;
        this.vy = (Math.random() - 0.5) * 0.5;
        this.baseAlpha = Math.random() * 0.5 + 0.2;
        this.alpha = this.baseAlpha;
        this.pulseSpeed = Math.random() * 0.02 + 0.005;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
        if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
        this.alpha = this.baseAlpha + Math.sin(Date.now() * this.pulseSpeed) * 0.2;
      }
      draw() {
        ctx.save();
        ctx.fillStyle = `rgba(247, 208, 112, ${Math.max(0, this.alpha)})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    for (let i = 0; i < DUST_COUNT; i++) {
      floatingDustParticles.push(new FloatingDust());
    }

    // -------------------------------------------------------------
    // 🎨 2. Logo 線條動態繪製與顏色波動 (亮金 <-> 橘金)
    // -------------------------------------------------------------
    // 顏色過渡插值函數 (RGB Color Interpolation)
    function interpolateColor(color1, color2, factor) {
      const r = Math.round(color1.r + factor * (color2.r - color1.r));
      const g = Math.round(color1.g + factor * (color2.g - color1.g));
      const b = Math.round(color1.b + factor * (color2.b - color1.b));
      return `rgb(${r}, ${g}, ${b})`;
    }

    const COLOR_BRIGHT_GOLD = { r: 247, g: 208, b: 112 }; // #F7D070 (亮金)
    const COLOR_ORANGE_GOLD = { r: 226, g: 140, b: 67 };  // #E28C43 (橘金)

    // 從你的 SVG 轉換過來的 60 條精確放射線條參數 [角度(rad), 長度(px), 寬度(px)]
    const rayCount = 60;
    const logoRays = [];
    for (let i = 0; i < rayCount; i++) {
      const angle = (i / rayCount) * Math.PI * 2;
      const isLong = i % 2 === 0;
      logoRays.push({
        angle: angle,
        baseLength: isLong ? 100 : 70,
        width: isLong ? (i % 4 === 0 ? 5.5 : 3.8) : 2.8,
        speedOffset: i * 0.25 // 個別線條的跳動相位差
      });
    }

    let globalTime = 0;

    function drawLogo() {
      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2 - 40; // 稍偏上方置中

      // 1. 計算顏色與光芒波動 (正弦波 0 ~ 1)
      const colorFactor = (Math.sin(globalTime * 1.5) + 1) / 2;
      const currentColor = interpolateColor(COLOR_ORANGE_GOLD, COLOR_BRIGHT_GOLD, colorFactor);
      const glowBlur = 8 + colorFactor * 16; // 光暈發光強度起伏

      ctx.save();
      ctx.shadowColor = 'rgba(247, 208, 112, 0.6)';
      ctx.shadowBlur = glowBlur;
      ctx.fillStyle = currentColor;
      ctx.strokeStyle = currentColor;

      // 2. 繪製中心圓與環
      ctx.beginPath();
      ctx.arc(centerX, centerY, 14, 0, Math.PI * 2);
      ctx.fill();

      // 3. 繪製外圍跳動延伸的放射線條
      const innerRadius = 45; // 圓環起點

      logoRays.forEach((ray) => {
        // 向外延伸與拉回的伸縮動態計算
        const stretch = Math.sin(globalTime * 3 + ray.speedOffset) * 12; // 伸縮幅度 ±12px
        const currentLength = ray.baseLength + stretch;

        const x1 = centerX + Math.cos(ray.angle) * innerRadius;
        const y1 = centerY + Math.sin(ray.angle) * innerRadius;
        const x2 = centerX + Math.cos(ray.angle) * (innerRadius + currentLength);
        const y2 = centerY + Math.sin(ray.angle) * (innerRadius + currentLength);

        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.lineWidth = ray.width;
        ctx.lineCap = 'round';
        ctx.stroke();
      });

      ctx.restore();
    }

    // -------------------------------------------------------------
    // 📝 3. GSAP 時間軸控制：5 秒延遲登場 Sequence
    // -------------------------------------------------------------
    function initTextAnimationSequence() {
      const tl = gsap.timeline();

      // 🎯 Logo 出現後，精確等待 5.0 秒才啟動文字動畫
      tl.to("#line1", {
        y: "0%",
        opacity: 1,
        duration: 2.0, // “回憶” 耗時 2 秒完成
        ease: "power2.out",
        delay: 5.0
      })
      .to("#line2", {
        y: "0%",
        opacity: 1,
        duration: 1.0, // “從這裡開始” 耗時 1 秒完成
        ease: "power2.out"
      }, "+=0.2") // 稍微間隔 0.2 秒
      .to("#nextPageBtn", {
        opacity: 1,
        duration: 0.8,
        onComplete: () => {
          // 箭頭跳動效果 (使用 GSAP yoyo 重複)
          gsap.to("#nextPageBtn", {
            y: 8,
            duration: 1.0,
            repeat: -1,
            yoyo: true,
            ease: "power1.inOut"
          });
        }
      });
    }

    // -------------------------------------------------------------
    // 🔄 4. 主渲染 Loop
    // -------------------------------------------------------------
    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 繪製微粒背景[cite: 1]
      floatingDustParticles.forEach(dust => {
        dust.update();
        dust.draw();
      });

      // 繪製 Logo 律動[cite: 1]
      drawLogo();

      globalTime += 0.03;
      requestAnimationFrame(animate);
    }

    // 啟動主程式
    animate();
    initTextAnimationSequence();
  </script>
</body>
</html>
