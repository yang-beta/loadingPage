<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>洸限 - 展覽導覽</title>

  <!-- 1. 字體與圖示庫 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;600;700&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="icon" href="data:,">

  <!-- 2. GSAP 核心動畫庫 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

  <style>
    /* =============================================================
       0. 全域與統一元件樣式
       ============================================================= */
    html, body {
      width: 100%;
      height: 100%;
      margin: 0 !important;
      padding: 0 !important;
      background-color: #1a1a1a !important;
      color: #E6E6E8 !important;
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      overflow: hidden;
      box-sizing: border-box;
    }

    *, *::before, *::after {
      box-sizing: inherit;
      margin: 0;
      padding: 0;
    }

    #mandalaCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
    }

    .sections-wrapper {
      width: 100vw;
      height: 100vh;
      transition: transform 0.8s cubic-bezier(0.65, 0, 0.35, 1);
      will-change: transform;
    }

    .section-page {
      width: 100vw;
      height: 100vh;
      position: relative;
      overflow: hidden;
    }

    /* 🎯 核心：全站統一的文字遮罩與文字級距結構 */
    .ui-line-mask {
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      padding-bottom: 4px;
      width: 100%;
    }

    .ui-line-content {
      font-family: 'Noto Serif TC', serif;
      font-size: 1.2rem;
      font-weight: 400;
      letter-spacing: 0.18em;
      color: #E6E6E8;
      transform: translateY(115%);
      opacity: 0;
      line-height: 1.8;
      will-change: transform, opacity;
      text-align: center;
      white-space: normal;
      word-break: break-word;
    }

    .skip-anim-btn {
      position: absolute;
      top: 30px;
      right: 40px;
      background: none;
      border: 1px solid rgba(230, 230, 232, 0.25);
      color: #E6E6E8;
      padding: 8px 16px;
      font-size: 12px;
      cursor: pointer;
      z-index: 20;
      opacity: 0; 
      pointer-events: none;
      transition: opacity 0.5s ease, background-color 0.3s ease, border-color 0.3s ease;
      border-radius: 20px;
    }

    .skip-anim-btn.show { opacity: 1; pointer-events: auto; }
    .skip-anim-btn:hover { background-color: rgba(255, 255, 255, 0.15); border-color: rgba(255, 255, 255, 0.5); }

    /* =============================================================
       1. Loading Page (載入頁)
       ============================================================= */
    #openingHero {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: #1a1a1a;
      z-index: 10;
    }

    #loadingCanvas {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 40vh;
      z-index: 1;
      pointer-events: none;
      transition: opacity 1.2s ease;
    }

    .loading-text-box {
      position: absolute;
      z-index: 10;
      font-size: 1.2rem;
      letter-spacing: 0.5em;
      color: #E6E6E8;
      font-weight: 300;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .char { opacity: 0; display: inline-block; transform: translateY(10px); }

    .logo-container {
      width: 500px;
      height: 500px;
      position: relative;
      z-index: 2;
      display: flex;
      justify-content: center;
      align-items: center;
      clip-path: circle(0% at 50% 50%);
      transform: scale(0.7);
      filter: blur(20px);
      opacity: 0;
      margin-bottom: -90px;
      margin-top: -30px;
      will-change: clip-path, transform, filter, opacity;
    }

    .logo-container svg {
      width: 100%;
      height: 100%;
      animation: goldGlowPulse 4.0s ease-in-out infinite alternate;
    }

    .st0 { fill: #f29850; }

    .interactive-area {
      position: relative;
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .title-wrapper { height: 36px; }
    .subtitle-wrapper-1 { height: 36px; margin-top: 10px; }
    .subtitle-wrapper-2 { height: 36px; margin-top: 10px; }

    .text-line { color: #E6E6E8; transform: translateY(200%); opacity: 0; line-height: 1; }
    .title-part1 { font-size: 1.2rem; letter-spacing: 0.4em; font-weight: 300; }
    .title-part2 { font-size: 1.2rem; letter-spacing: 0.4em; font-weight: 300; opacity: 0.9; }

    .scroll-arrow-btn { margin-top: 24px; background: none; border: none; cursor: pointer; outline: none; opacity: 0; }
    .arrow-icon { width: 36px; height: 36px; stroke: #E6E6E8; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0px 0px 6px rgba(230, 230, 232, 0.5)); }

    @keyframes goldGlowPulse {
      0% { filter: drop-shadow(0 0 8px rgba(242, 152, 80, 0.4)); }
      50% { filter: drop-shadow(0 0 24px rgba(247, 208, 112, 0.85)); }
      100% { filter: drop-shadow(0 0 12px rgba(242, 152, 80, 0.5)); }
    }

    /* =============================================================
       2. Banner 頁
       ============================================================= */
    .hero-container {
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }

    .brand-logo-img {
      width: 320px;
      max-width: 75vw;
      height: auto;
      opacity: 0; 
      margin-bottom: 2.5rem;
      filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.15));
      will-change: opacity, transform;
    }

    .banner-questions-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      width: 90%;
      max-width: 800px;
    }

    .banner-question-part { font-size: 1.2rem; font-weight: 300; letter-spacing: 0.2rem; }
    .bq-part:last-child { margin-left: 0.8rem; }

    .scroll-hint-v {
      position: absolute;
      bottom: 8%;
      opacity: 0;
      cursor: pointer;
      z-index: 5;
      background: none;
      border: none;
      outline: none;
      transition: transform 0.3s;
    }
    .scroll-hint-v:hover { transform: scale(1.15); }

    /* =============================================================
       3. Page 2 (第一頁 視聽演示 - 沙畫頁)
       ============================================================= */
    .audiovisual-section {
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      background-color: #1a1a1a !important;
      position: relative;
    }

    #CanvasAnime {
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    #text-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      width: 90%;
      max-width: 850px;
      pointer-events: none;
    }

    .dot-char {
      opacity: 0;
      display: inline-block;
      margin: 0 2px;
    }

    /* =============================================================
       📱 手機版 (Mobile RWD) 統一渲染規範
       ============================================================= */
    @media (max-width: 768px) {
      #text-container, .banner-questions-wrapper {
        width: 92% !important;
        max-width: 92% !important;
        padding: 0 10px;
      }

      /* 🎯 全站段落文字在手機上一律強制對齊相同規格，防止突兀變大或爆框 */
      .ui-line-content, 
      .banner-question-part, 
      .story-line {
        font-size: 1.02rem !important;
        letter-spacing: 0.08em !important;
        line-height: 1.7 !important;
      }

      .banner-questions-wrapper .ui-line-mask {
        flex-wrap: wrap !important;
        height: auto !important;
        overflow: visible !important;
        gap: 4px;
        margin-bottom: 12px;
      }

      .bq-part:last-child {
        margin-left: 0 !important;
      }

      .brand-logo-img {
        width: 220px !important;
        max-width: 65vw !important;
        margin-bottom: 1.8rem !important;
      }

      .logo-container {
        width: 300px !important;
        height: 300px !important;
        margin-bottom: -50px !important;
      }

      .skip-anim-btn {
        top: 20px !important;
        right: 20px !important;
        padding: 6px 12px !important;
        font-size: 11px !important;
      }
    }
  </style>
</head>

  <script>
    const DPR = Math.min(window.devicePixelRatio || 1, 1.5);
    gsap.config({ force3D: true });

    // =============================================================
    // 🌊 1. 開場水波紋 Canvas (Loading Page)
    // =============================================================
    const lCanvas = document.getElementById('loadingCanvas');
    const lCtx = lCanvas.getContext('2d');

    function resizeLoadingCanvas() {
      lCanvas.width = window.innerWidth * DPR;
      lCanvas.height = (window.innerHeight * 0.4) * DPR;
    }
    resizeLoadingCanvas();
    window.addEventListener('resize', resizeLoadingCanvas);

    let step = 0;
    let isWaveActive = true;
    const waveParams = Array.from({ length: 20 }, () => ({
      phaseOffset: Math.random() * Math.PI * 2,
      speed: 0.015 + Math.random() * 0.01,
      frequency1: 0.003 + Math.random() * 0.002,
      frequency2: 0.007 + Math.random() * 0.003,
      amplitude: 12 + Math.random() * 8
    }));

    function drawWaveLandscape() {
      if (!isWaveActive) return;
      lCtx.clearRect(0, 0, lCanvas.width, lCanvas.height);
      const W = lCanvas.width, H = lCanvas.height;

      waveParams.forEach((p, i) => {
        lCtx.beginPath();
        lCtx.strokeStyle = `rgba(180, 150, 120, ${0.05 + (i / 20) * 0.25})`;
        lCtx.lineWidth = 1.2 * DPR;
        const baseY = H * 0.2 + (i * 8 * DPR);

        for (let x = 0; x <= W; x += 16 * DPR) {
          const wave1 = Math.sin((x * p.frequency1) + (step * p.speed) + p.phaseOffset);
          const wave2 = Math.cos((x * p.frequency2) - (step * p.speed * 0.8) + p.phaseOffset);
          const y = baseY + (wave1 * p.amplitude * DPR) + (wave2 * (p.amplitude * 0.5 * DPR));
          
          if (x === 0) lCtx.moveTo(x, y);
          else lCtx.lineTo(x, y);
        }
        lCtx.stroke();
      });
      step += 1;
      requestAnimationFrame(drawWaveLandscape);
    }
    drawWaveLandscape();

    // =============================================================
    // 🌌 2. 全頁背景 Canvas ( Banner 頁波浪光束 )
    // =============================================================
    const bgCanvas = document.getElementById('mandalaCanvas');
    const bgCtx = bgCanvas.getContext('2d');
    let isBgCanvasRendering = true;

    function resizeBgCanvas() {
      bgCanvas.width = window.innerWidth * DPR;
      bgCanvas.height = window.innerHeight * DPR;
    }
    resizeBgCanvas();
    window.addEventListener('resize', resizeBgCanvas);

    let animationParams = { beamDownProgress: 0, horizonSpreadProgress: 0, particleGlowProgress: 0 };
    const goldParticles = Array.from({ length: 50 }, () => ({
      x: Math.random() * window.innerWidth * DPR,
      y: Math.random() * window.innerHeight * DPR,
      size: (Math.random() * 2.5 + 0.8) * DPR,
      alpha: Math.random() * 0.6 + 0.2,
      speedY: (Math.random() - 0.5) * 0.8 * DPR,
      speedX: (Math.random() - 0.5) * 0.5 * DPR,
      pulse: Math.random() * Math.PI
    }));

    const diagParams = Array.from({ length: 28 }, (_, i) => ({
      isTopStart: i % 2 === 0,
      startPosRatio: (i / 27) * 0.15,
      endPosRatio: 0.7 + (i / 27) * 0.5,
      speed: 0.015 + Math.random() * 0.015,
      phase: Math.random() * Math.PI * 2,
      frequency1: 0.003 + Math.random() * 0.002,
      frequency2: 0.006 + Math.random() * 0.003,
      amplitude1: (18 + Math.random() * 15) * DPR,
      amplitude2: (10 + Math.random() * 8) * DPR,
      alpha: 0.08 + Math.random() * 0.18,
      width: (Math.random() * 1.5 + 0.8) * DPR
    }));

    let globalTime = 0;

    function drawLightBeams() {
      const progress = animationParams.beamDownProgress;
      if (progress <= 0) return;
      const W = bgCanvas.width, H = bgCanvas.height, margin = 120 * DPR;

      bgCtx.save();
      diagParams.forEach(p => {
        let startX = p.isTopStart ? (p.startPosRatio * W) - margin : -margin;
        let startY = p.isTopStart ? -margin : (p.startPosRatio * H) - margin;
        const endX = W + margin + (p.endPosRatio * 0.2 * W);
        const endY = H + margin + (p.endPosRatio * 0.2 * H);

        const targetLen = Math.hypot(endX - startX, endY - startY);
        const currentLen = targetLen * progress;
        const dirX = (endX - startX) / targetLen, dirY = (endY - startY) / targetLen;
        const nx = -dirY, ny = dirX;

        bgCtx.beginPath();
        bgCtx.strokeStyle = `rgba(210, 190, 155, ${p.alpha * progress})`;
        bgCtx.lineWidth = p.width;

        let isFirstPoint = true;
        for (let dist = 0; dist <= currentLen; dist += 20 * DPR) {
          const baseX = startX + dirX * dist, baseY = startY + dirY * dist;
          const wave1 = Math.sin(dist * p.frequency1 + globalTime * p.speed + p.phase) * p.amplitude1;
          const wave2 = Math.cos(dist * p.frequency2 - globalTime * p.speed * 0.8 + p.phase) * p.amplitude2;
          const px = baseX + nx * (wave1 + wave2), py = baseY + ny * (wave1 + wave2);

          if (isFirstPoint) { bgCtx.moveTo(px, py); isFirstPoint = false; }
          else bgCtx.lineTo(px, py);
        }
        bgCtx.stroke();
      });
      bgCtx.restore();
    }

    function drawGoldParticles() {
      if (animationParams.particleGlowProgress <= 0) return;
      goldParticles.forEach(p => {
        p.x = (p.x + p.speedX + bgCanvas.width) % bgCanvas.width;
        p.y = (p.y + p.speedY + bgCanvas.height) % bgCanvas.height;
        p.pulse += 0.02;

        bgCtx.save();
        bgCtx.fillStyle = `rgba(235, 195, 100, ${Math.max(0, (Math.sin(p.pulse) * 0.2 + p.alpha) * animationParams.particleGlowProgress)})`;
        bgCtx.beginPath();
        bgCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        bgCtx.fill();
        bgCtx.restore();
      });
    }

    function renderBg() {
      if (!isBgCanvasRendering) return;
      globalTime += 1;
      bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
      bgCtx.fillStyle = 'rgba(26, 26, 26, 1)';
      bgCtx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);

      drawLightBeams();
      drawGoldParticles();
      requestAnimationFrame(renderBg);
    }
    renderBg();

    // =============================================================
    // ⏳ 3. 沙畫動畫與統一文字時間軸
    // =============================================================
    const sandCanvas = document.getElementById('CanvasAnime');
    const sandCtx = sandCanvas.getContext('2d');

    function resizeSandCanvas() {
      sandCanvas.width = window.innerWidth * DPR;
      sandCanvas.height = window.innerHeight * DPR;
    }
    resizeSandCanvas();
    window.addEventListener('resize', resizeSandCanvas);

    const ALL_IMAGE_SOURCES = [
      '/img/dog-l.png', '/img/grandpa-l.png', '/img/grandmom-l.png',
      '/img/lovers-l.png', '/img/kid-l.png', '/img/cat-l.png'
    ];

    let floatingDustParticles = [];
    let sandImageParticles = [];
    let sandGlobalProgress = { t: 0 };
    let totalAnimationDuration = 20;
    let isSandInitialized = false;

    class FloatingDust {
      constructor() {
        this.x = Math.random() * sandCanvas.width;
        this.y = Math.random() * sandCanvas.height;
        this.size = (Math.random() * 2.2 + 0.8) * DPR;
        this.vx = (Math.random() - 0.5) * 0.8 * DPR;
        this.vy = (Math.random() - 0.5) * 0.8 * DPR;
        this.baseAlpha = Math.random() * 0.6 + 0.3;
        this.pulseSpeed = Math.random() * 0.02 + 0.005;
      }
      update() {
        this.x = (this.x + this.vx + sandCanvas.width) % sandCanvas.width;
        this.y = (this.y + this.vy + sandCanvas.height) % sandCanvas.height;
      }
      draw() {
        sandCtx.save();
        sandCtx.fillStyle = `rgba(240, 195, 110, ${this.baseAlpha + Math.sin(Date.now() * this.pulseSpeed) * 0.2})`;
        sandCtx.beginPath();
        sandCtx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        sandCtx.fill();
        sandCtx.restore();
      }
    }

    class SandParticle {
      constructor(targetX, targetY, delay) {
        this.targetX = targetX;
        this.targetY = targetY;
        this.delay = delay;
        this.startX = -Math.random() * sandCanvas.width * 0.4 - 50;
        this.startY = targetY + (Math.random() - 0.5) * 200 * DPR;
        this.endX = sandCanvas.width + Math.random() * sandCanvas.width * 0.4 + 50;
        this.endY = targetY + (Math.random() - 0.5) * 200 * DPR;
        this.x = this.startX;
        this.y = this.startY;
        this.size = (Math.random() * 1.0 + 0.8) * DPR;
        this.baseAlpha = Math.random() * 0.65 + 0.35;
        this.alpha = 0;
        this.noiseX = (Math.random() - 0.5) * 1.8 * DPR;
        this.noiseY = (Math.random() - 0.5) * 1.8 * DPR;
      }
      update(totalElapsedSec) {
        const localTime = totalElapsedSec - this.delay;
        if (localTime < 0 || localTime > 7.5) { this.alpha = 0; return; }
        const progress = localTime / 7.5;

        if (progress < 0.25) {
          const p = progress / 0.25;
          this.x = this.startX + (this.targetX - this.startX) * (1 - Math.pow(1 - p, 2));
          this.y = this.startY + (this.targetY - this.startY) * (1 - Math.pow(1 - p, 2));
          this.alpha = Math.min(1, p * 1.5) * this.baseAlpha;
        } else if (progress <= 0.70) {
          this.x = this.targetX + Math.sin(Date.now() * 0.003 + this.targetY) * this.noiseX;
          this.y = this.targetY + Math.cos(Date.now() * 0.003 + this.targetX) * this.noiseY;
          this.alpha = this.baseAlpha;
        } else {
          const p = (progress - 0.70) / 0.30;
          this.x = this.targetX + (this.endX - this.targetX) * (p * p);
          this.y = this.targetY + (this.endY - this.targetY) * (p * p);
          this.alpha = this.baseAlpha * (1 - p);
        }
      }
      draw() {
        if (this.alpha <= 0) return;
        sandCtx.fillStyle = `rgba(240, 195, 110, ${this.alpha})`;
        sandCtx.beginPath();
        sandCtx.arc(this.x | 0, this.y | 0, this.size, 0, Math.PI * 2);
        sandCtx.fill();
      }
    }

    // 🎯 統一改寫後的文字動畫時間軸控制
    function playTextAnimationSequence() {
      const storyLines = document.querySelectorAll('.story-line');
      const textTl = gsap.timeline();

      const textStartTime = totalAnimationDuration + 0.5; 

      // 1. 前 4 行故事文字優雅輪流登場
      for (let i = 0; i < 4; i++) {
        const line = storyLines[i];
        const lineAppearTime = textStartTime + (i * 3.0);

        textTl.to(line, {
          y: "0%",
          opacity: 1,
          duration: 2.0,
          ease: "power2.out"
        }, lineAppearTime);

        textTl.to(line, {
          opacity: 0,
          duration: 2.0,
          ease: "power2.inOut"
        }, lineAppearTime + 2.0 + 7.0);
      }

      // 2. 🎯 第 5 行（金句）：使用與前幾行完全相同的 ui-line-mask 向上滑出
      const lastLineExitTime = textStartTime + (4 * 3.0) + 2.0 + 7.0 + 0.8;
      const goldenLine = document.getElementById('goldenLine');

      textTl.to(goldenLine, {
        y: "0%",
        opacity: 1,
        duration: 2.0,
        ease: "power2.out"
      }, lastLineExitTime)
      .to("#dot1", { opacity: 1, duration: 0.3 }, "+=0.5")
      .to("#dot2", { opacity: 1, duration: 0.3 }, "+=0.5")
      .to("#dot3", { opacity: 1, duration: 0.3 }, "+=0.5");
    }

    async function initSandArtSection() {
      if (isSandInitialized) return;
      isSandInitialized = true;

      floatingDustParticles = Array.from({ length: 45 }, () => new FloatingDust());

      const shuffled = [...ALL_IMAGE_SOURCES].sort(() => 0.5 - Math.random()).slice(0, 4);
      let currentDelay = 0;
      
      const imageConfigs = shuffled.map((src, i) => {
        if (i > 0) currentDelay += 6.0;
        return { src, delay: currentDelay };
      });

      totalAnimationDuration = imageConfigs[imageConfigs.length - 1].delay + 7.5 + 0.5;

      const loadPromises = imageConfigs.map((config) => {
        return new Promise((resolve) => {
          const img = new Image();
          img.src = config.src;
          img.onload = () => {
            const isMobile = window.innerWidth <= 768;
            const TARGET_WIDTH = (isMobile ? 280 : 450) * DPR;
            const scale = TARGET_WIDTH / img.width;
            const imgW = img.width * scale, imgH = img.height * scale;

            const W = sandCanvas.width, H = sandCanvas.height;
            const finalX = W / 2;
            const finalY = H / 2;

            const offscreen = document.createElement('canvas');
            offscreen.width = sandCanvas.width; offscreen.height = sandCanvas.height;
            const offCtx = offscreen.getContext('2d');
            offCtx.drawImage(img, finalX - imgW / 2, finalY - imgH / 2, imgW, imgH);

            const data = offCtx.getImageData(0, 0, sandCanvas.width, sandCanvas.height).data;
            const groupParticles = [];
            const gap = Math.round(3 * DPR);

            for (let y = 0; y < sandCanvas.height; y += gap) {
              for (let x = 0; x < sandCanvas.width; x += gap) {
                const idx = (y * sandCanvas.width + x) * 4;
                if (data[idx + 3] > 50 && (data[idx] + data[idx + 1] + data[idx + 2]) / 3 < 230) {
                  groupParticles.push(new SandParticle(x, y, config.delay));
                }
              }
            }
            resolve(groupParticles);
          };
          img.onerror = () => resolve([]);
        });
      });

      const results = await Promise.all(loadPromises);
      sandImageParticles = results.flat();

      playTextAnimationSequence();

      gsap.to(sandGlobalProgress, {
        t: totalAnimationDuration + 40, 
        duration: totalAnimationDuration + 40,
        ease: "none"
      });

      animateSand();
    }

    function animateSand() {
      sandCtx.clearRect(0, 0, sandCanvas.width, sandCanvas.height);
      floatingDustParticles.forEach(d => { d.update(); d.draw(); });

      sandImageParticles.forEach(p => { p.update(sandGlobalProgress.t); p.draw(); });
      requestAnimationFrame(animateSand);
    }

    // =============================================================
    // 🎬 4. GSAP 開場與 Banner 時間軸控制
    // =============================================================
    const mainTl = gsap.timeline();
    gsap.set("#line1, #line2, #line3", { y: "200%", opacity: 0 });

    mainTl.to(".loading-text-box .char", { opacity: 1, y: 0, duration: 0.6, stagger: 0.7, ease: "power2.out" })
    .call(() => { document.getElementById('loadingSkipBtn').classList.add('show'); })
    .to({}, { duration: 0.8 })
    .to("#loadingText", { opacity: 0, duration: 1.0, ease: "power2.inOut" })
    .to("#logoBox", { clipPath: "circle(70% at 50% 50%)", scale: 1, filter: "blur(0px)", opacity: 1, duration: 3.5, ease: "power1.inOut" }, "-=0.5")
    .to({}, { duration: 1.5 })
    .to("#line1", { y: "0%", opacity: 1, duration: 1.5, ease: "power2.out" })
    .to("#line2", { y: "0%", opacity: 1, duration: 1.2, ease: "power2.out" }, "+=0.2")
    .to("#line3", { y: "0%", opacity: 1, duration: 1.0, ease: "power2.out" }, "+=0.2")
    .to("#startExhibitionBtn", {
      opacity: 1, duration: 0.8,
      onComplete: () => { gsap.to("#startExhibitionBtn", { y: 8, duration: 1.0, repeat: -1, yoyo: true, ease: "power1.inOut" }); }
    });

    let bannerTimeline = null;
    let isBeamAnimated = false;

    function playBannerBeamAnimation() {
      if (isBeamAnimated) return;
      isBeamAnimated = true;

      bannerTimeline = gsap.timeline();
      bannerTimeline.to(animationParams, { beamDownProgress: 1, duration: 1.6, ease: "power2.inOut" })
      .to(animationParams, { horizonSpreadProgress: 1, duration: 1.4, ease: "power2.out" }, "-=0.2")
      .to(".brand-logo-img", { opacity: 1, duration: 1.4, ease: "power1.out" }, "-=1.0")
      .to(animationParams, { particleGlowProgress: 1, duration: 1.2, ease: "power1.out" }, "-=0.4");
      
      const bqParts = document.querySelectorAll('.bq-part');
      
      bannerTimeline.to(bqParts[0], { y: "0%", opacity: 1, duration: 1.4, ease: "power2.out" }, "-=0.4")
      .to(bqParts[1], { y: "0%", opacity: 1, duration: 1.4, ease: "power2.out" }, "+=1.5")
      .to(bqParts[2], { y: "0%", opacity: 1, duration: 1.4, ease: "power2.out" }, "+=1.5")
      .to(bqParts[3], { y: "0%", opacity: 1, duration: 1.4, ease: "power2.out" }, "+=1.5")
      .to(bqParts[4], { y: "0%", opacity: 1, duration: 1.4, ease: "power2.out" }, "+=1.5")
      .to(bqParts[5], { y: "0%", opacity: 1, duration: 1.4, ease: "power2.out" }, "+=1.5")
      .to(".scroll-hint-v", { opacity: 1, duration: 1 });
    }

    function skipLoadingToBanner() {
      mainTl.progress(1);
      goToPage(1);
    }

    function scrollToContent() {
      if (bannerTimeline) {
        bannerTimeline.progress(1);
      } else {
        animationParams.beamDownProgress = 1;
        animationParams.horizonSpreadProgress = 1;
        animationParams.particleGlowProgress = 1;
        gsap.set(".brand-logo-img, .scroll-hint-v", { opacity: 1 });
        gsap.set(".bq-part", { y: "0%", opacity: 1 });
      }
      gsap.to("#bannerSkipBtn", { opacity: 0, pointerEvents: "none", duration: 0.4 });
    }

    // =============================================================
    // 🎯 5. 全頁 Snap 滾動控制
    // =============================================================
    let currentPageIndex = 0;
    const totalPages = 3;
    let isScrollLocked = false;

    function goToPage(index) {
      if (index < 0 || index >= totalPages || isScrollLocked) return;
      
      isScrollLocked = true;
      currentPageIndex = index;

      document.getElementById('sectionsWrapper').style.transform = `translateY(-${currentPageIndex * 100}vh)`;

      if (currentPageIndex === 0) {
        lCanvas.style.opacity = '1';
        if (!isBgCanvasRendering) { isBgCanvasRendering = true; renderBg(); }
      } else if (currentPageIndex === 1) {
        lCanvas.style.opacity = '0';
        playBannerBeamAnimation();
        if (!isBgCanvasRendering) { isBgCanvasRendering = true; renderBg(); }
      } else if (currentPageIndex === 2) {
        lCanvas.style.opacity = '0';
        playBannerBeamAnimation();
        isBgCanvasRendering = false;
        initSandArtSection();
      }

      setTimeout(() => { isScrollLocked = false; }, 850);
    }

    function nextPage() { goToPage(currentPageIndex + 1); }

    window.addEventListener('wheel', (e) => {
      if (isScrollLocked) return;
      if (e.deltaY > 20) nextPage();
      else if (e.deltaY < -20) goToPage(currentPageIndex - 1);
    }, { passive: true });

    let touchStartY = 0;
    window.addEventListener('touchstart', (e) => { touchStartY = e.touches[0].clientY; }, { passive: true });
    window.addEventListener('touchend', (e) => {
      if (isScrollLocked) return;
      const deltaY = touchStartY - e.changedTouches[0].clientY;
      if (deltaY > 50) nextPage();
      else if (deltaY < -50) goToPage(currentPageIndex - 1);
    }, { passive: true });
  </script>
</body>
