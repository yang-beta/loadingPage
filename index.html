<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>洸限 - 展覽導覽</title>

  <!-- 1. 字體與圖示庫 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;600;700&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="icon" href="data:,">

  <!-- 2. GSAP 核心動畫庫 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

  <style>
    /* =============================================================
       0. 全域與統一元件樣式 (模組化設計)
       ============================================================= */
    html, body {
      width: 100%;
      height: 100%;
      margin: 0 !important;
      padding: 0 !important;
      background-color: #1a1a1a !important;
      color: #E6E6E8 !important;
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      overflow: hidden;
      box-sizing: border-box;
    }

    *, *::before, *::after {
      box-sizing: inherit;
      margin: 0;
      padding: 0;
    }

    /* 全頁背景 Canvas */
    #mandalaCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
    }

    .sections-wrapper {
      width: 100vw;
      height: 100vh;
      transition: transform 0.8s cubic-bezier(0.65, 0, 0.35, 1);
      will-change: transform;
    }

    .section-page {
      width: 100vw;
      height: 100vh;
      position: relative;
      overflow: hidden;
    }

    /* 🎯 統一通用的文字遮罩與動畫容器 (徹底解決抖動，全站通用) */
    .ui-line-mask {
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      padding-bottom: 4px;
      white-space: nowrap;
    }

    .ui-line-content {
      font-family: 'Noto Serif TC', serif;
      font-size: 1.35rem;
      font-weight: 400;
      letter-spacing: 0.2em;
      color: #E6E6E8;
      transform: translateY(115%);
      opacity: 0;
      line-height: 1.6;
      will-change: transform, opacity;
      display: inline-flex;
      align-items: center;
    }

    .skip-anim-btn {
      position: absolute;
      top: 30px;
      right: 40px;
      background: none;
      border: 1px solid rgba(230, 230, 232, 0.25);
      color: #E6E6E8;
      padding: 8px 16px;
      font-size: 12px;
      cursor: pointer;
      z-index: 20;
      opacity: 0; 
      pointer-events: none;
      transition: opacity 0.5s ease;
      border-radius: 20px;
    }

    .skip-anim-btn.show { opacity: 1; pointer-events: auto; }

    /* =============================================================
       1. Loading Page
       ============================================================= */
    #openingHero {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: #1a1a1a;
      z-index: 10;
    }

    #loadingCanvas {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 40vh;
      z-index: 1;
      pointer-events: none;
      transition: opacity 1.2s ease;
    }

    .loading-text-box {
      position: absolute;
      z-index: 10;
      font-size: 1.2rem;
      letter-spacing: 0.5em;
      color: #E6E6E8;
      font-weight: 300;
      display: flex;
    }

    .char { opacity: 0; transform: translateY(10px); }

    .logo-container {
      width: 580px;
      height: 580px;
      position: relative;
      z-index: 2;
      display: flex;
      justify-content: center;
      align-items: center;
      clip-path: circle(0% at 50% 50%);
      transform: scale(0.7);
      filter: blur(20px);
      opacity: 0;
      margin-bottom: -110px;
      margin-top: -40px;
    }

    .logo-container svg {
      width: 100%;
      height: 100%;
      animation: goldGlowPulse 4.0s ease-in-out infinite alternate;
    }

    .st0 { fill: #f29850; }

    .interactive-area {
      position: relative;
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .title-wrapper { height: 48px; }
    .subtitle-wrapper-1 { height: 36px; margin-top: 12px; }
    .subtitle-wrapper-2 { height: 36px; margin-top: 6px; }

    .text-line { color: #E6E6E8; transform: translateY(200%); opacity: 0; }
    .title-part1 { font-size: 1.6rem; letter-spacing: 0.4em; }
    .title-part2 { font-size: 1.1rem; letter-spacing: 0.3em; opacity: 0.9; }

    .scroll-arrow-btn { margin-top: 24px; background: none; border: none; cursor: pointer; opacity: 0; }
    .arrow-icon { width: 36px; height: 36px; stroke: #E6E6E8; stroke-width: 2; fill: none; }

    @keyframes goldGlowPulse {
      0% { filter: drop-shadow(0 0 8px rgba(242, 152, 80, 0.4)); }
      50% { filter: drop-shadow(0 0 24px rgba(247, 208, 112, 0.85)); }
      100% { filter: drop-shadow(0 0 12px rgba(242, 152, 80, 0.5)); }
    }

    /* =============================================================
       2. Banner 頁 (使用統一 Flexbox 遮罩架構)
       ============================================================= */
    .hero-container {
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }

    .brand-title {
      font-family: 'Noto Serif TC', serif;
      font-size: 4.5rem;
      font-weight: 300;
      letter-spacing: 1.2rem;
      padding-left: 1.2rem;
      color: #E6E6E8;
      opacity: 0; 
      margin-bottom: 2.5rem;
    }

    .banner-questions-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    .banner-question-part { font-size: 1.25rem; font-weight: 300; letter-spacing: 0.25rem; }

    .scroll-hint-v {
      position: absolute;
      bottom: 8%;
      opacity: 0;
      cursor: pointer;
      z-index: 5;
      background: none;
      border: none;
    }

    /* =============================================================
       3. Page 2 沙畫頁 (使用統一遮罩 + 全新時序控制)
       ============================================================= */
    .audiovisual-section {
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: #1a1a1a !important;
      position: relative;
    }

    #CanvasAnime {
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    #text-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      width: 85%;
      max-width: 900px;
      pointer-events: none;
    }

    .dot-char { opacity: 0; display: inline-block; }
    .final-part2 { opacity: 0; transform: translateY(100%); display: inline-block; }
  </style>
</head>
<body>

  <!-- 全頁背景 Canvas -->
  <canvas id="mandalaCanvas"></canvas>

  <div class="sections-wrapper" id="sectionsWrapper">

    <!-- Page 0. Loading Page -->
    <div class="section-page" id="openingHero">
      <button class="skip-anim-btn" id="loadingSkipBtn" onclick="skipLoadingToBanner()">Skip 略過動畫 ✕</button>

      <canvas id="loadingCanvas"></canvas>

      <div class="loading-text-box" id="loadingText">
        <span class="char">載</span><span class="char">入</span><span class="char">中</span>
        <span class="char">．</span><span class="char">．</span><span class="char">．</span>
      </div>

      <div class="logo-container" id="logoBox">
        <!-- SVG Logo 保持不變 -->
        <svg id="_圖層_1" data-name="圖層_1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 841.89 595.28">
          <circle class="st0" cx="420.88" cy="297.44" r="14.4"/>
          <g><path class="st0" d="M329.25,244.97l-2.57,4.77,21.71,11.72c1.1-1.46,2.21-2.92,3.33-4.36l-22.47-12.12Z"/></g>
        </svg>
      </div>

      <div class="interactive-area">
        <div class="ui-line-mask title-wrapper"><div class="text-line title-part1" id="line1">回億</div></div>
        <div class="ui-line-mask subtitle-wrapper-1"><div class="text-line title-part2" id="line2">從這裡</div></div>
        <div class="ui-line-mask subtitle-wrapper-2"><div class="text-line title-part2" id="line3">開始</div></div>

        <button class="scroll-arrow-btn" id="startExhibitionBtn" onclick="nextPage()">
          <svg class="arrow-icon" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"></polyline></svg>
        </button>
      </div>
    </div>

    <!-- Page 1. Banner 頁 (採用 Flex 雙區塊，徹底流暢) -->
    <div class="section-page hero-container" id="heroSection">
      <button class="skip-anim-btn show" id="bannerSkipBtn" onclick="scrollToContent()">Skip 略過動畫 ✕</button>

      <h1 class="brand-title">洸限</h1>

      <div class="banner-questions-wrapper">
        <div class="ui-line-mask">
          <div class="ui-line-content banner-question-part bq-part">你的生命中，有沒有一個人 ――</div>
          <div class="ui-line-content banner-question-part bq-part">讓你成就了今天的自己？</div>
        </div>
        <div class="ui-line-mask">
          <div class="ui-line-content banner-question-part bq-part">哪一段回憶，當每次想起 ――</div>
          <div class="ui-line-content banner-question-part bq-part">都會微笑？</div>
        </div>
        <div class="ui-line-mask">
          <div class="ui-line-content banner-question-part bq-part">有沒有一份陪伴，即使經過很久 ――</div>
          <div class="ui-line-content banner-question-part bq-part">依然溫暖著你？</div>
        </div>
      </div>

      <button class="scroll-hint-v" onclick="nextPage()">
        <svg class="arrow-icon" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"></polyline></svg>
      </button>
    </div>

    <!-- Page 2. 第一頁 視聽演示 (沙畫頁) -->
    <div class="section-page audiovisual-section" id="audiovisualSection">
      <canvas id="CanvasAnime"></canvas>

      <div id="text-container">
        <div class="ui-line-mask"><div class="ui-line-content story-line">也許是那位一直默默遞上肩膀、比你還相信你自己的摯友</div></div>
        <div class="ui-line-mask"><div class="ui-line-content story-line">或者是無論你飛得高不高、只在乎你累不累的家人</div></div>
        <div class="ui-line-mask"><div class="ui-line-content story-line">也可能是永遠怕你吃不飽、過不好的長輩嘮叨</div></div>
        <div class="ui-line-mask"><div class="ui-line-content story-line">還有那無論多晚回家，總在門口搖著尾巴、或把你當作全世界的毛孩</div></div>
        
        <!-- 結尾金句 -->
        <div class="ui-line-mask" style="margin-top: 15px;">
          <div class="ui-line-content" id="finalGoldenLine">
            <span id="fPart1" style="opacity:0; transform:translateY(100%); display:inline-block;">回憶 雖然會慢慢消逝</span>
            <span class="dot-char" id="dot1">．</span>
            <span class="dot-char" id="dot2">．</span>
            <span class="dot-char" id="dot3">．</span>
            <span class="final-part2" id="fPart2">卻也會停留</span>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script>
    const DPR = Math.min(window.devicePixelRatio || 1, 1.5);

    // GSAP 全域預設優化：開啟 3D 硬體加速
    gsap.config({ force3D: true });

    // =============================================================
    // 🌊 1. 開場水波紋 (Loading Page)
    // =============================================================
    const lCanvas = document.getElementById('loadingCanvas');
    const lCtx = lCanvas.getContext('2d');

    function resizeLoadingCanvas() {
      lCanvas.width = window.innerWidth * DPR;
      lCanvas.height = (window.innerHeight * 0.4) * DPR;
    }
    resizeLoadingCanvas();

    let step = 0;
    let isWaveActive = true;
    const waveParams = Array.from({ length: 20 }, () => ({
      phaseOffset: Math.random() * Math.PI * 2,
      speed: 0.015 + Math.random() * 0.01,
      frequency1: 0.003 + Math.random() * 0.002,
      frequency2: 0.007 + Math.random() * 0.003,
      amplitude: 12 + Math.random() * 8
    }));

    function drawWaveLandscape() {
      if (!isWaveActive) return;
      lCtx.clearRect(0, 0, lCanvas.width, lCanvas.height);
      const W = lCanvas.width, H = lCanvas.height;

      waveParams.forEach((p, i) => {
        lCtx.beginPath();
        lCtx.strokeStyle = `rgba(180, 150, 120, ${0.05 + (i / 20) * 0.25})`;
        lCtx.lineWidth = 1.2 * DPR;
        const baseY = H * 0.2 + (i * 8 * DPR);

        for (let x = 0; x <= W; x += 16 * DPR) {
          const y = baseY + (Math.sin((x * p.frequency1) + (step * p.speed) + p.phaseOffset) * p.amplitude * DPR);
          if (x === 0) lCtx.moveTo(x, y);
          else lCtx.lineTo(x, y);
        }
        lCtx.stroke();
      });
      step += 1;
      requestAnimationFrame(drawWaveLandscape);
    }
    drawWaveLandscape();

    // =============================================================
    // 🌌 2. 全頁背景 Canvas ( Banner 頁波浪光束 )
    // =============================================================
    const bgCanvas = document.getElementById('mandalaCanvas');
    const bgCtx = bgCanvas.getContext('2d');
    let isBgCanvasRendering = true;

    function resizeBgCanvas() {
      bgCanvas.width = window.innerWidth * DPR;
      bgCanvas.height = window.innerHeight * DPR;
    }
    resizeBgCanvas();

    let animationParams = { beamDownProgress: 0, horizonSpreadProgress: 0, particleGlowProgress: 0 };
    let globalTime = 0;

    function renderBg() {
      if (!isBgCanvasRendering) return;
      globalTime += 1;
      bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
      bgCtx.fillStyle = 'rgba(26, 26, 26, 1)';
      bgCtx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);

      requestAnimationFrame(renderBg);
    }
    renderBg();

    // =============================================================
    // ⏳ 3. 沙畫動畫與全新時序 (🎯 快結束前 3 秒登場文字)
    // =============================================================
    const sandCanvas = document.getElementById('CanvasAnime');
    const sandCtx = sandCanvas.getContext('2d');

    function resizeSandCanvas() {
      sandCanvas.width = window.innerWidth * DPR;
      sandCanvas.height = window.innerHeight * DPR;
    }
    resizeSandCanvas();

    let totalAnimationDuration = 15; // 預設沙畫時長
    let isSandInitialized = false;

    // 🎯 精確計算：沙畫快結束前 3 秒才開始啟動文字鏈
    function playTextAnimationSequence() {
      const storyLines = document.querySelectorAll('.story-line');
      const textTl = gsap.timeline();

      // 關鍵時間點：沙畫動畫時長減去 3.0 秒
      const textStartTime = Math.max(2.0, totalAnimationDuration - 3.0); 

      storyLines.forEach((line, index) => {
        const lineAppearTime = textStartTime + (index * 2.0); // 逐行間隔 2 秒

        // 1. 登場
        textTl.to(line, {
          y: "0%",
          opacity: 1,
          duration: 1.6,
          ease: "power2.out"
        }, lineAppearTime);

        // 2. 登場後各自停留 6 秒單獨淡出
        textTl.to(line, {
          opacity: 0,
          duration: 1.6,
          ease: "power2.inOut"
        }, lineAppearTime + 1.6 + 6.0);
      });

      // 3. 第 4 行消失後接續登場最後金句
      const lastLineExitTime = textStartTime + (3 * 2.0) + 1.6 + 6.0 + 0.8;

      textTl.to("#fPart1", { y: "0%", opacity: 1, duration: 1.6, ease: "power2.out" }, lastLineExitTime)
      .to("#dot1", { opacity: 1, duration: 0.2 }, "+=0.5")
      .to("#dot2", { opacity: 1, duration: 0.2 }, "+=0.5")
      .to("#dot3", { opacity: 1, duration: 0.2 }, "+=0.5")
      .to("#fPart2", { y: "0%", opacity: 1, duration: 1.6, ease: "power2.out" }, "+=0.5");
    }

    async function initSandArtSection() {
      if (isSandInitialized) return;
      isSandInitialized = true;

      // 模擬沙畫總時長計算 (實際會根據圖片載入計算)
      totalAnimationDuration = 14.5; 

      // 啟動延後登場的文案鏈
      playTextAnimationSequence();
    }

    // =============================================================
    // 🎬 4. Banner 頁時間軸控制 (流暢無抖動)
    // =============================================================
    let bannerTimeline = null;

    function playBannerBeamAnimation() {
      if (bannerTimeline) return;

      bannerTimeline = gsap.timeline();
      const bqParts = document.querySelectorAll('.bq-part');
      
      bannerTimeline.to(".brand-title", { opacity: 1, duration: 1.4, ease: "power1.out" })
      
      // 前後段梯次滑出，Flexbox 結構保證極致滑順
      .to(bqParts[0], { y: "0%", opacity: 1, duration: 1.4, ease: "power2.out" }, "-=0.4")
      .to(bqParts[1], { y: "0%", opacity: 1, duration: 1.4, ease: "power2.out" }, "+=1.5")
      
      .to(bqParts[2], { y: "0%", opacity: 1, duration: 1.4, ease: "power2.out" }, "+=1.5")
      .to(bqParts[3], { y: "0%", opacity: 1, duration: 1.4, ease: "power2.out" }, "+=1.5")

      .to(bqParts[4], { y: "0%", opacity: 1, duration: 1.4, ease: "power2.out" }, "+=1.5")
      .to(bqParts[5], { y: "0%", opacity: 1, duration: 1.4, ease: "power2.out" }, "+=1.5")

      .to(".scroll-hint-v", { opacity: 1, duration: 1 });
    }

    // =============================================================
    // 🎯 5. 全頁 Snap 滾動控制
    // =============================================================
    let currentPageIndex = 0;

    function goToPage(index) {
      if (index < 0 || index >= 3) return;
      currentPageIndex = index;

      document.getElementById('sectionsWrapper').style.transform = `translateY(-${currentPageIndex * 100}vh)`;

      if (currentPageIndex === 1) {
        playBannerBeamAnimation();
      } else if (currentPageIndex === 2) {
        initSandArtSection();
      }
    }

    function nextPage() { goToPage(currentPageIndex + 1); }

    window.addEventListener('wheel', (e) => {
      if (e.deltaY > 20) nextPage();
      else if (e.deltaY < -20) goToPage(currentPageIndex - 1);
    }, { passive: true });
  </script>
</body>
</html>
